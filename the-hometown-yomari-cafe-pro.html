<style>
:root{--red:#6d202e;--red2:#8c3040;--cream:#fbf7ef;--paper:#fff;--ink:#26211e;--muted:#756b64;--gold:#b28b4d;--line:#eadfd2;--soft:#f3e9dc;--green:#197a48;--shadow:0 18px 55px rgba(48,25,18,.12)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{width:min(1180px,calc(100% - 32px));margin:auto}
.top{background:var(--red);color:#fff;text-align:center;font-size:11px;letter-spacing:.13em;padding:9px}
header{position:sticky;top:0;z-index:50;background:#fffdfaf5;backdrop-filter:blur(15px);border-bottom:1px solid var(--line)}.nav{height:74px;display:flex;align-items:center;gap:25px}.logo{font:700 21px Georgia,serif;color:var(--red);line-height:.95;cursor:pointer}.logo span{display:block;font:700 8px Inter,sans-serif;letter-spacing:.2em;color:var(--muted);margin-top:7px}.links{display:flex;gap:20px;margin-left:auto}.links button{border:0;background:none;font-weight:800;font-size:12px;color:var(--ink)}.links button:hover{color:var(--red)}.actions{display:flex;gap:8px}.round{border:1px solid var(--line);background:#fff;border-radius:12px;width:42px;height:42px}.hamb{display:none}
.hero{padding:70px 0 60px;background:radial-gradient(circle at 90% 5%,#ead6bd 0,transparent 30%),linear-gradient(125deg,#fbf7ef,#f2e6d5)}.heroGrid{display:grid;grid-template-columns:1.02fr .98fr;gap:55px;align-items:center}.eyebrow{font-size:11px;letter-spacing:.19em;text-transform:uppercase;color:var(--red);font-weight:900}.hero h1{font:700 clamp(46px,6vw,78px)/.97 Georgia,serif;letter-spacing:-.045em;margin:14px 0 22px}.hero p{font-size:18px;color:var(--muted);line-height:1.7;max-width:590px}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:900}.primary{background:var(--red);color:#fff}.outline{background:#fff;color:var(--red);border:1px solid var(--red)}.heroBtns{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}.heroVisual{height:430px;border-radius:30px;overflow:hidden;position:relative;box-shadow:var(--shadow);background:#ddd}.heroVisual img{width:100%;height:100%;object-fit:cover}.heroVisual:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,#2d1611a8)}.heroLabel{position:absolute;z-index:2;bottom:22px;left:22px;color:#fff}.heroLabel b{font:700 27px Georgia,serif;display:block}.heroLabel small{opacity:.9}
section{padding:70px 0}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:25px}.head h2{font:700 40px Georgia,serif;margin:5px 0}.head p{color:var(--muted);margin:0;line-height:1.6}.linkBtn{border:0;background:none;color:var(--red);font-weight:900}
.catrow{display:flex;gap:9px;overflow:auto;padding-bottom:5px;margin-bottom:20px}.pill{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 15px;font-size:12px;font-weight:900}.pill.active{background:var(--red);color:#fff;border-color:var(--red)}
.tools{display:flex;gap:10px;margin-bottom:25px}.search{flex:1;position:relative}.search input{width:100%;padding:14px 16px 14px 44px;border:1px solid var(--line);border-radius:13px;background:#fff;outline:none}.search span{position:absolute;left:16px;top:12px}.filter{border:1px solid var(--line);background:#fff;border-radius:13px;padding:0 14px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;transition:.2s;position:relative}.card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}.pic{height:190px;position:relative;background:#eadcca;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover;transition:.35s}.card:hover .pic img{transform:scale(1.04)}.heart{position:absolute;right:12px;top:12px;border:0;background:#fffdd;backdrop-filter:blur(6px);width:36px;height:36px;border-radius:50%}.body{padding:16px}.tag{font-size:9px;text-transform:uppercase;letter-spacing:.13em;color:var(--gold);font-weight:900}.body h3{font:700 20px Georgia,serif;margin:6px 0}.desc{font-size:12px;color:var(--muted);margin:0 0 11px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.miniPrice{font-weight:900;color:var(--red);font-size:13px}.select{width:100%;margin-top:10px;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff}.add{width:100%;margin-top:9px;padding:11px;border:0;border-radius:10px;background:var(--red);color:#fff;font-weight:900}.add:hover{background:var(--red2)}.empty{grid-column:1/-1;text-align:center;border:1px dashed #d8c9ba;border-radius:18px;padding:45px;color:var(--muted)}
.feature{background:#29221e;color:#fff}.feature .eyebrow{color:#d4b476}.feature .head h2{color:#fff}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.fbox{padding:25px;border:1px solid #51433b;border-radius:18px;background:#322a25}.fbox b{font:700 23px Georgia,serif}.fbox p{color:#d2c6bc;line-height:1.65;font-size:14px}
.promo{background:#f0e0cc}.promoGrid{display:grid;grid-template-columns:1fr 1fr;gap:45px;align-items:center}.promo h2{font:700 43px Georgia,serif}.promo p{color:var(--muted);line-height:1.8}.mosaic{display:grid;grid-template-columns:1.2fr .8fr;grid-template-rows:160px 160px;gap:10px}.mosaic div{border-radius:18px;overflow:hidden}.mosaic div:first-child{grid-row:1/3}.mosaic img{width:100%;height:100%;object-fit:cover}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.gallery div{height:190px;border-radius:17px;overflow:hidden;background:#ddd}.gallery img{width:100%;height:100%;object-fit:cover}
.visit{background:#fff}.visitGrid{display:grid;grid-template-columns:1fr 1fr;gap:35px;align-items:stretch}.mapCard{border-radius:24px;overflow:hidden;min-height:330px;background:#e7dfd3;position:relative}.mapCard iframe{width:100%;height:100%;min-height:330px;border:0;filter:saturate(.8)}.mapFallback{display:flex;align-items:center;justify-content:center;height:100%;text-align:center;padding:30px}.locationBox{background:#fbf7ef;border:1px solid var(--line);padding:28px;border-radius:24px}.locationBox h2{font:700 38px Georgia,serif}.locationBox p{color:var(--muted);line-height:1.8}.contactBtns{display:flex;gap:10px;flex-wrap:wrap}
footer{background:#211b18;color:#fff;padding:50px 0}.foot{display:grid;grid-template-columns:1.7fr 1fr 1fr;gap:40px}.foot h3{font:700 22px Georgia,serif}.foot p,.foot a{color:#cfc4bb;line-height:1.7;text-decoration:none;font-size:13px;display:block;margin:7px 0}
.cartFab{position:fixed;right:18px;bottom:18px;z-index:60;border:0;background:var(--red);color:#fff;padding:14px 18px;border-radius:999px;box-shadow:var(--shadow);font-weight:900}
.overlay{position:fixed;inset:0;background:#0008;z-index:100;display:none}.overlay.open{display:block}.drawer{position:absolute;right:0;top:0;height:100%;width:min(470px,94vw);background:#fffdf9;padding:22px;overflow:auto;animation:slide .22s ease}@keyframes slide{from{transform:translateX(100%)}to{transform:none}}.drawerHead{display:flex;align-items:center;justify-content:space-between}.drawerHead h2{font:700 30px Georgia,serif}.x{border:0;background:#f0e7dc;border-radius:10px;width:40px;height:40px}.cartLine{display:flex;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}.cartPic{width:62px;height:62px;border-radius:12px;overflow:hidden;flex:none}.cartPic img{width:100%;height:100%;object-fit:cover}.cartInfo{flex:1}.cartInfo b{display:block}.muted{font-size:12px;color:var(--muted)}.qty{display:flex;align-items:center;gap:7px;margin-top:8px}.qty button{width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:7px}.remove{border:0;background:none;color:#a34a4a;font-size:11px;margin-left:auto}.sum{padding-top:18px}.sumrow{display:flex;justify-content:space-between;margin:8px 0}.total{font-size:19px;font-weight:900;border-top:1px solid var(--line);padding-top:15px;margin-top:12px}.checkoutBtn{width:100%;margin-top:15px}
.modal{position:fixed;inset:0;z-index:110;background:#0008;display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modalBox{background:#fffdf9;width:min(780px,100%);max-height:92vh;overflow:auto;border-radius:25px;padding:24px;box-shadow:var(--shadow)}.modalTop{display:flex;justify-content:space-between;gap:15px}.productDetail{display:grid;grid-template-columns:1fr 1fr;gap:25px}.detailImg{height:390px;border-radius:20px;overflow:hidden}.detailImg img{width:100%;height:100%;object-fit:cover}.detail h2{font:700 40px Georgia,serif;margin:7px 0}.variantBtns{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.vbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 13px}.vbtn.selected{border-color:var(--red);background:#f5e5e7;color:var(--red);font-weight:900}.detailPrice{font-size:24px;color:var(--red);font-weight:900}.quantityBig{display:flex;gap:10px;align-items:center;margin:18px 0}.quantityBig button{width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:9px}
.checkoutPage{padding:70px 0}.checkoutGrid{display:grid;grid-template-columns:1fr 1fr;gap:30px}.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:25px}.panel h2{font:700 34px Georgia,serif}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);padding:12px;border-radius:10px;background:#fff}.notice{background:#fff1d9;border:1px solid #ead3a8;padding:12px;border-radius:10px;font-size:12px;color:#72511e}
.admin{background:#f4ede4;padding:70px 0}.adminGrid{display:grid;grid-template-columns:230px 1fr;gap:18px}.adminNav,.adminPanel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.adminNav button{width:100%;text-align:left;border:0;background:none;padding:11px;border-radius:9px;font-weight:800}.adminNav button.active{background:#f5e7e9;color:var(--red)}.adminRow{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:15px 0;border-bottom:1px solid var(--line)}.edit{border:1px solid var(--red);background:#fff;color:var(--red);border-radius:8px;padding:7px 11px;font-weight:800}
.mobileNav{display:none}
@media(max-width:950px){.links{display:none}.hamb{display:block}.heroGrid,.visitGrid,.promoGrid,.checkoutGrid{grid-template-columns:1fr}.grid{grid-template-columns:repeat(3,1fr)}.features{grid-template-columns:1fr}.foot{grid-template-columns:1fr 1fr}.heroVisual{height:350px}}
@media(max-width:650px){.wrap{width:calc(100% - 22px)}.nav{height:66px}.hamb{display:block;border:1px solid var(--line);background:#fff;border-radius:10px;width:40px;height:40px}.hero{padding:45px 0}.hero h1{font-size:46px}.heroVisual{height:300px}.grid{grid-template-columns:1fr 1fr;gap:12px}.pic{height:145px}.body{padding:12px}.body h3{font-size:17px}.gallery{grid-template-columns:1fr 1fr}.gallery div{height:140px}.mosaic{grid-template-rows:120px 120px}.foot{grid-template-columns:1fr}.head{display:block}.head .linkBtn{margin-top:12px}.productDetail{grid-template-columns:1fr}.detailImg{height:280px}.adminGrid{grid-template-columns:1fr}.mobileNav.open{display:block;position:absolute;top:66px;left:0;right:0;background:#fffdf9;border-bottom:1px solid var(--line);padding:12px 16px}.mobileNav button{display:block;width:100%;padding:12px;border:0;background:none;text-align:left;font-weight:900}.top{font-size:9px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const PRODUCTS=[{"id": "yomari", "name": "Yomari", "cat": "Yomari Special", "emoji": "🍡", "image": "https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=900&q=85", "variants": [["Chaku", 50], ["Khuwa", 70]]}, {"id": "chatamari", "name": "Chatamari", "cat": "Yomari Special", "emoji": "🥞", "image": "https://images.unsplash.com/photo-1601050690117-94f5f6fa8bd7?auto=format&fit=crop&w=900&q=85", "variants": [["Plain", 30], ["Egg", 70], ["Keema", 100]]}, {"id": "bara", "name": "Bara", "cat": "Yomari Special", "emoji": "🥘", "image": "https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=900&q=85", "variants": [["Plain", 50], ["Egg", 90], ["Keema", 120]]}, {"id": "khajaset", "name": "Newari Khaja Set", "cat": "Yomari Special", "emoji": "🍱", "image": "https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&q=85", "variants": [["Buff", 350], ["Chicken", 350]]}, {"id": "keemanoodles", "name": "Keema Noodles", "cat": "Yomari Special", "emoji": "🍜", "image": "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=900&q=85", "variants": [["Buff", 160], ["Chicken", 160]]}, {"id": "katiroll", "name": "Kati Roll", "cat": "Yomari Special", "emoji": "🌯", "image": "https://images.unsplash.com/photo-1565299507177-b0ac66763828?auto=format&fit=crop&w=900&q=85", "variants": [["Buff", 185], ["Chicken", 185]]}, {"id": "steam", "name": "Steam Momo", "cat": "Fast Foods", "emoji": "🥟", "image": "https://images.unsplash.com/photo-1496116218417-1a781b1c416c?auto=format&fit=crop&w=900&q=85", "variants": [["Buff", 150], ["Chicken", 150], ["Veg", 120]]}, {"id": "kothe", "name": "Kothe Momo", "cat": "Fast Foods", "emoji": "🥟", "image": "https://images.unsplash.com/photo-1625220194771-7ebdea0b70b9?auto=format&fit=crop&w=900&q=85", "variants": [["Buff", 200], ["Chicken", 200], ["Veg", 170]]}, {"id": "sadheko", "name": "C / Sadheko Momo", "cat": "Fast Foods", "emoji": "🥟", "image": "https://images.unsplash.com/photo-1617622141675-d3005b9067b5?auto=format&fit=crop&w=900&q=85", "variants": [["Buff", 250], ["Chicken", 250], ["Veg", 200]]}, {"id": "chowmin", "name": "Chowmin", "cat": "Fast Foods", "emoji": "🍜", "image": "https://images.unsplash.com/photo-1585032226651-759b368d7246?auto=format&fit=crop&w=900&q=85", "variants": [["Buff", 160], ["Chicken", 160], ["Veg", 120]]}, {"id": "thukpa", "name": "Thukpa", "cat": "Fast Foods", "emoji": "🍜", "image": "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=900&q=85", "variants": [["Buff", 180], ["Chicken", 180], ["Veg", 140]]}, {"id": "spring", "name": "Spring Roll", "cat": "Fast Foods", "emoji": "🌯", "image": "https://images.unsplash.com/photo-1548507200-0a6e6fce0b0a?auto=format&fit=crop&w=900&q=85", "variants": [["Buff", 200], ["Chicken", 200], ["Veg", 140]]}, {"id": "friedrice", "name": "Fried Rice", "cat": "Fast Foods", "emoji": "🍚", "image": "https://images.unsplash.com/photo-1603133872878-684f208fb84b?auto=format&fit=crop&w=900&q=85", "variants": [["Buff", 200], ["Chicken", 200], ["Veg", 150]]}, {"id": "choila", "name": "Choila & Sekuwa", "cat": "Yomari Snacks", "emoji": "🍢", "image": "https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=900&q=85", "variants": [["Buff", 220], ["Chicken", 220]]}, {"id": "chilli", "name": "Chilli", "cat": "Yomari Snacks", "emoji": "🌶️", "image": "https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&q=85", "variants": [["Buff", 250], ["Chicken", 280], ["B/L", null]]}, {"id": "wings", "name": "Chicken Wings", "cat": "Yomari Snacks", "emoji": "🍗", "image": "https://images.unsplash.com/photo-1527477396000-e27163b481c2?auto=format&fit=crop&w=900&q=85", "variants": [["Spicy", 350], ["Non-Spicy", 300]]}];
const CATS=["ALL","Yomari Special","Fast Foods","Yomari Snacks"];
const PHONE="9843370892", COORD="27.640639,85.515750";
let cart=JSON.parse(localStorage.getItem("hometownCart")||"[]");
let S={page:"home",cat:"ALL",q:"",cart:false,mobile:false,detail:null,detailVariant:0,detailQty:1,checkout:false,admin:false};
const $=s=>document.querySelector(s);
const money=n=>n==null?"Price to be confirmed":"Rs. "+n;
function save(){localStorage.setItem("hometownCart",JSON.stringify(cart))}
function go(p){S.page=p;S.mobile=false;S.detail=null;S.checkout=false;S.admin=false;render();scrollTo(0,0)}
function product(id){return PRODUCTS.find(x=>x.id===id)}
function add(id,vi=0,qty=1){let p=product(id),v=p.variants[vi];if(v[1]==null){alert("This price is not confirmed yet.");return}let key=id+"|"+v[0],x=cart.find(i=>i.key===key);if(x)x.qty+=qty;else cart.push({key,id,variant:v[0],price:v[1],qty});save();S.cart=true;render()}
function change(key,d){let x=cart.find(i=>i.key===key);if(!x)return;x.qty+=d;if(x.qty<1)cart=cart.filter(i=>i.key!==key);save();render()}
function removeItem(key){cart=cart.filter(i=>i.key!==key);save();render()}
function count(){return cart.reduce((a,x)=>a+x.qty,0)}
function subtotal(){return cart.reduce((a,x)=>a+x.qty*x.price,0)}
function setCat(c){S.cat=c;render()}
function filtered(){let q=S.q.toLowerCase().trim();return PRODUCTS.filter(p=>(S.cat==="ALL"||p.cat===S.cat)&&(!q||(p.name+" "+p.cat+" "+p.variants.map(v=>v[0]).join(" ")).toLowerCase().includes(q)))}
function card(p){
 let start=p.variants.filter(v=>v[1]!=null).map(v=>v[1]),min=Math.min(...start);
 return `<article class="card"><div class="pic"><img loading="lazy" src="${p.image}" alt="${p.name}" onerror="this.style.display='none'"><button class="heart" onclick="openDetail('${p.id}')">♡</button></div><div class="body"><div class="tag">${p.cat}</div><h3>${p.name}</h3><p class="desc">Choose your preferred variant.</p><div class="row"><span class="miniPrice">From ${money(min)}</span><span>${p.variants.length} options</span></div><select class="select" id="v-${p.id}">${p.variants.map((v,i)=>`<option value="${i}" ${v[1]==null?"disabled":""}>${v[0]} · ${money(v[1])}</option>`).join("")}</select><button class="add" onclick="add('${p.id}',Number(document.getElementById('v-${p.id}').value))">Add to Cart</button></div></article>`
}
function menu(limit=false){
 let a=filtered();if(limit)a=a.slice(0,8);
 return `<section id="menu"><div class="wrap"><div class="head"><div><div class="eyebrow">Discover the menu</div><h2>${S.page==="menu"?"Our Menu":"Popular from the menu"}</h2><p>Browse categories, compare variants and add your selection to the local demo cart.</p></div>${S.page!=="menu"?`<button class="linkBtn" onclick="go('menu')">View all →</button>`:""}</div>${S.page==="menu"?`<div class="tools"><div class="search"><span>⌕</span><input id="search" value="${S.q.replaceAll('"','&quot;')}" placeholder="Search Momo, Chicken, Yomari..." oninput="S.q=this.value;refreshGrid()"></div><button class="filter" onclick="S.q='';S.cat='ALL';render()">Reset</button></div><div class="catrow">${CATS.map(c=>`<button class="pill ${S.cat===c?"active":""}" onclick="setCat('${c}')">${c}</button>`).join("")}</div>`:""}<div id="grid" class="grid">${a.length?a.map(card).join(""):`<div class="empty"><h3>No results</h3><p>Try a different food name or category.</p><button class="btn outline" onclick="S.q='';S.cat='ALL';render()">Reset search</button></div>`}</div></div></section>`
}
function refreshGrid(){let g=$("#grid");if(g)g.innerHTML=filtered().map(card).join("")||`<div class="empty"><h3>No results</h3><p>Try a different search.</p></div>`}
function hero(){return `<section class="hero"><div class="wrap heroGrid"><div><div class="eyebrow">The Hometown Yomari Cafe</div><h1>The Taste of Home, Served with Tradition.</h1><p>Explore a modern take on the flavours and favourites of The Hometown Yomari Cafe.</p><div class="heroBtns"><button class="btn primary" onclick="go('menu')">Explore Menu</button><button class="btn outline" onclick="document.getElementById('visit').scrollIntoView()">Visit Us</button></div></div><div class="heroVisual"><img src="${PRODUCTS[6].image}" alt="Food at The Hometown Yomari Cafe"><div class="heroLabel"><b>Made for cravings.</b><small>Warm food. Modern discovery.</small></div></div></div></section>`}
function features(){return `<section class="feature"><div class="wrap"><div class="head"><div><div class="eyebrow">The experience</div><h2>Simple, warm, food-first.</h2></div></div><div class="features"><div class="fbox"><b>Traditional inspiration</b><p>Newari-inspired flavours and familiar favourites presented through a modern cafe interface.</p></div><div class="fbox"><b>Easy discovery</b><p>Search, browse categories, compare variants and build a cart in a few taps.</p></div><div class="fbox"><b>Ready to grow</b><p>Content is separated from the interface so a future CMS can update products, prices and images.</p></div></div></div></section>`}
function promo(){return `<section class="promo"><div class="wrap promoGrid"><div><div class="eyebrow">Yomari Special</div><h2>A digital menu that feels as good as the food.</h2><p>Designed with familiar food-app patterns — fast discovery, clear pricing, strong product imagery, quick add-to-cart actions and a smooth mobile experience — while keeping the identity focused on The Hometown Yomari Cafe.</p><button class="btn primary" onclick="go('menu')">Explore the full menu</button></div><div class="mosaic"><div><img src="${PRODUCTS[0].image}" alt="Yomari"></div><div><img src="${PRODUCTS[7].image}" alt="Momo"></div><div><img src="${PRODUCTS[10].image}" alt="Thukpa"></div></div></div></section>`}
function gallery(){return `<section><div class="wrap"><div class="head"><div><div class="eyebrow">Gallery</div><h2>Food, atmosphere, discovery.</h2><p>Demo imagery is easy to replace with actual cafe photography.</p></div></div><div class="gallery">${PRODUCTS.slice(0,8).map(p=>`<div><img loading="lazy" src="${p.image}" alt="${p.name}"></div>`).join("")}</div></div></section>`}
function visit(){return `<section class="visit" id="visit"><div class="wrap visitGrid"><div class="locationBox"><div class="eyebrow">Visit Us</div><h2>The Hometown Yomari Cafe</h2><p><b>Phone</b><br>${PHONE}</p><p><b>Location</b><br>27°38'26.3"N 85°30'56.7"E<br><span class="muted">27.640639, 85.515750</span></p><div class="contactBtns"><a class="btn primary" href="tel:${PHONE}">Call Us</a><a class="btn outline" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${COORD}">Get Directions</a></div></div><div class="mapCard"><iframe title="Location map" loading="lazy" src="https://www.google.com/maps?q=${COORD}&z=16&output=embed"></iframe></div></div></section>`}
function home(){return hero()+menu(true)+features()+promo()+gallery()+visit()}
function about(){return `<section><div class="wrap promoGrid"><div><div class="eyebrow">About</div><h2 style="font:700 46px Georgia,serif">Tradition, presented for today.</h2><p style="color:var(--muted);line-height:1.9">The Hometown Yomari Cafe is presented here as a warm, modern cafe experience built around food and Newari-inspired flavours. This demo intentionally avoids unconfirmed founding stories, awards, reviews, statistics or other claims.</p><p style="color:var(--muted);line-height:1.9">Future brand copy, story, team information and other content can be managed through the CMS.</p></div><div class="heroVisual"><img src="${PRODUCTS[3].image}" alt="Newari Khaja Set"></div></div></section>`}
function offers(){return `<section><div class="wrap"><div class="eyebrow">Offers</div><h2 style="font:700 47px Georgia,serif">Special offers can live here.</h2><p style="color:var(--muted);max-width:650px;line-height:1.8">No real discount is being invented. Seasonal promotions can later be created and managed from the admin panel.</p><div class="features" style="margin-top:30px"><div class="fbox" style="color:var(--ink);background:#fff"><b>Coming Soon</b><p>Seasonal selections.</p></div><div class="fbox" style="color:var(--ink);background:#fff"><b>Demo</b><p>Promotional card placeholder.</p></div><div class="fbox" style="color:var(--ink);background:#fff"><b>Editable</b><p>Content managed from the future CMS.</p></div></div></div></section>`}
function contact(){return `<section><div class="wrap checkoutGrid"><div><div class="eyebrow">Contact</div><h2 style="font:700 46px Georgia,serif">Let's connect.</h2><p style="color:var(--muted);line-height:1.8">Phone: <b>${PHONE}</b><br>Location: <b>27°38'26.3"N 85°30'56.7"E</b></p><div class="contactBtns"><a class="btn primary" href="tel:${PHONE}">Call Us</a><a class="btn outline" target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${COORD}">Get Directions</a></div></div><div class="panel"><h2>Send a message</h2><div class="field"><label>Full Name</label><input placeholder="Your name"></div><div class="field"><label>Phone</label><input placeholder="Phone"></div><div class="field"><label>Email</label><input placeholder="Email — placeholder until confirmed"></div><div class="field"><label>Message</label><textarea rows="5" placeholder="Your message"></textarea></div><button class="btn primary" onclick="alert('Demo contact form — not connected.')">Send Message</button></div></div></section>`}
function checkout(){let total=subtotal();return `<section class="checkoutPage"><div class="wrap checkoutGrid"><div class="panel"><div class="eyebrow">Demo checkout</div><h2>Finish your selection.</h2><p style="color:var(--muted)">This is a frontend demonstration. No real order will be placed.</p><div class="notice">Demo Payment — Not Connected</div><div class="field"><label>Full Name</label><input placeholder="Full name"></div><div class="field"><label>Phone</label><input placeholder="Phone"></div><div class="field"><label>Email</label><input placeholder="Email"></div><div class="field"><label>Address</label><textarea rows="3" placeholder="Address"></textarea></div><div class="field"><label>Order Type</label><select><option>Demo pickup</option><option>Demo delivery</option></select></div><div class="field"><label>Payment Method</label><select><option>Demo Payment — Not Connected</option></select></div><button class="btn primary" onclick="alert('Demo only — no real order was placed.')">Place Demo Order</button></div><div class="panel"><div class="eyebrow">Order summary</div><h2>Your cart</h2>${cart.length?cart.map(x=>`<div class="adminRow"><span>${product(x.id).name}<br><small>${x.variant} × ${x.qty}</small></span><b>${money(x.price*x.qty)}</b></div>`).join("")+`<div class="total"><div class="sumrow"><span>Subtotal</span><span>${money(total)}</span></div><div class="sumrow"><b>Total</b><b>${money(total)}</b></div></div>`:`<div class="empty">Your cart is empty.</div>`}</div></div></section>`}
function admin(){return `<section class="admin"><div class="wrap"><div class="eyebrow">Admin / CMS concept</div><h2 style="font:700 46px Georgia,serif;margin:8px 0">Edit the content, keep the design.</h2><p style="color:var(--muted);max-width:700px;line-height:1.7">UI concept only. It is not connected to a production database.</p><div class="adminGrid" style="margin-top:25px"><div class="adminNav"><button class="active">Dashboard</button><button>Menu</button><button>Categories</button><button>Products</button><button>Prices</button><button>Images</button><button>Offers</button><button>Website Content</button><button>Gallery</button><button>Contact Information</button></div><div class="adminPanel"><h3>Editable content preview</h3><div class="adminRow"><span><b>Steam Momo</b><br>Buff · Rs. 150</span><button class="edit" onclick="alert('Demo editor — backend not connected.')">Edit</button></div><div class="adminRow"><span><b>Phone</b><br>${PHONE}</span><button class="edit" onclick="alert('Demo editor — backend not connected.')">Edit</button></div><div class="adminRow"><span><b>Location</b><br>${COORD}</span><button class="edit" onclick="alert('Demo editor — backend not connected.')">Edit</button></div><div class="adminRow"><span><b>Gallery</b><br>Replace images without changing layout</span><button class="edit" onclick="alert('Demo editor — backend not connected.')">Edit</button></div></div></div></div></section>`}
function header(){return `<div class="top">THE HOMETOWN YOMARI CAFE · MODERN DIGITAL EXPERIENCE</div><header><div class="wrap nav"><button class="hamb" onclick="S.mobile=!S.mobile;render()">☰</button><div class="logo" onclick="go('home')">The Hometown<br>Yomari Cafe<span>Authentic taste · modern experience</span></div><nav class="links">${["home","menu","offers","about","gallery","contact"].map(p=>`<button onclick="go('${p}')">${p.toUpperCase()}</button>`).join("")}</nav><div class="actions"><button class="round" onclick="go('menu');setTimeout(()=>$('#search')?.focus(),50)">⌕</button><button class="round" onclick="S.cart=true;render()">🛒<sup>${count()||""}</sup></button></div></div>${S.mobile?`<div class="mobileNav open">${["home","menu","offers","about","gallery","contact"].map(p=>`<button onclick="go('${p}')">${p.toUpperCase()}</button>`).join("")}<button onclick="S.admin=true;S.mobile=false;render()">ADMIN PREVIEW</button></div>`:""}</header>`}
function footer(){return `<footer><div class="wrap foot"><div><h3>The Hometown Yomari Cafe</h3><p>Authentic taste, modern experience.</p><p>© The Hometown Yomari Cafe</p></div><div><h3>Quick Links</h3>${["home","menu","offers","about","gallery","contact"].map(p=>`<a href="#" onclick="go('${p}');return false">${p[0].toUpperCase()+p.slice(1)}</a>`).join("")}</div><div><h3>Contact</h3><p>${PHONE}<br>27°38'26.3"N 85°30'56.7"E</p><a href="tel:${PHONE}">Call Us</a><a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${COORD}">Get Directions</a><p>Instagram · Facebook · TikTok</p></div></div></footer>`}
function cartDrawer(){return `<button class="cartFab" onclick="S.cart=true;render()">🛒 ${count()?count()+" item"+(count()>1?"s":"")+" · Rs. "+subtotal():"Cart"}</button><div class="overlay ${S.cart?"open":""}" onclick="if(event.target===this){S.cart=false;render()}"><aside class="drawer"><div class="drawerHead"><h2>Your Cart</h2><button class="x" onclick="S.cart=false;render()">×</button></div>${cart.length?cart.map(x=>{let p=product(x.id);return `<div class="cartLine"><div class="cartPic"><img src="${p.image}" alt="${p.name}"></div><div class="cartInfo"><b>${p.name}</b><span class="muted">${x.variant} · ${money(x.price)}</span><div class="qty"><button onclick="change('${x.key}',-1)">−</button><span>${x.qty}</span><button onclick="change('${x.key}',1)">+</button><button class="remove" onclick="removeItem('${x.key}')">Remove</button></div></div></div>`}).join("")+`<div class="sum"><div class="sumrow"><span>Subtotal</span><b>${money(subtotal())}</b></div><div class="sumrow"><span>Delivery</span><span>Demo</span></div><div class="sumrow total"><span>Total</span><b>${money(subtotal())}</b></div><button class="btn primary checkoutBtn" onclick="S.cart=false;S.checkout=true;S.page='checkout';render()">Proceed to Demo Checkout</button></div>`:`<div class="empty" style="margin-top:30px"><h3>Your cart is waiting for something delicious.</h3><p>Add a few menu favourites to see them here.</p><button class="btn primary" onclick="S.cart=false;S.page='menu';render()">Browse Menu</button></div>`}</aside></div>`}
function detailModal(){if(!S.detail)return"";let p=product(S.detail),v=p.variants[S.detailVariant];return `<div class="modal open" onclick="if(event.target===this){S.detail=null;render()}"><div class="modalBox"><div class="modalTop"><div class="eyebrow">${p.cat}</div><button class="x" onclick="S.detail=null;render()">×</button></div><div class="productDetail"><div class="detailImg"><img src="${p.image}" alt="${p.name}"></div><div class="detail"><div class="tag">${p.cat}</div><h2>${p.name}</h2><p class="muted">Select a variant and quantity. Prices shown are the supplied menu prices.</p><div class="variantBtns">${p.variants.map((x,i)=>`<button class="vbtn ${i===S.detailVariant?"selected":""}" ${x[1]==null?"disabled":""} onclick="S.detailVariant=${i};render()">${x[0]} · ${money(x[1])}</button>`).join("")}</div><div class="detailPrice">${money(v[1])}</div><div class="quantityBig"><button onclick="S.detailQty=Math.max(1,S.detailQty-1);render()">−</button><b>${S.detailQty}</b><button onclick="S.detailQty++;render()">+</button></div><button class="btn primary" style="width:100%" ${v[1]==null?"disabled":""} onclick="add('${p.id}',${S.detailVariant},${S.detailQty});S.detail=null;render()">Add ${S.detailQty} to Cart · ${v[1]==null?"":money(v[1]*S.detailQty)}</button></div></div></div></div>`}
function openDetail(id){S.detail=id;S.detailVariant=0;S.detailQty=1;render()}
function render(){let content=S.admin?admin():S.checkout?checkout():S.page==="home"?home():S.page==="menu"?menu():S.page==="offers"?offers():S.page==="about"?about():S.page==="gallery"?gallery():S.page==="contact"?contact():home();$("#root").innerHTML=header()+content+footer()+cartDrawer()+detailModal()}
render();
</script>
</body>
</html>
